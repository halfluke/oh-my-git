name: "Build"

on:
  push:
    tags:
      - '*'

env:
  PROJECT_NAME: oh-my-git
  GODOT_VERSION: 4.6.2
  HOME: /github/home
  GODOT: godot

jobs:
  build:
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.6.2
    steps:
      - name: Get tag name
        id: tag_name
        run: echo "TAG_NAME=${GITHUB_REF#refs/tags/}" >> "$GITHUB_OUTPUT"
      - name: Install dependencies
        run: apt-get update && apt-get install -y rsync p7zip make libfontconfig1
      - uses: actions/checkout@v4
      - name: Setup
        run: |
          mkdir -p "$HOME" "$HOME/.local/share/godot/export_templates"
          echo "HOME=$HOME" >> "$GITHUB_ENV"
          cp -a "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" \
            "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      - name: Build Linux
        run: make linux GODOT="$GODOT"
      - name: Build macOS
        run: make macos GODOT="$GODOT"
      - name: Build Windows
        run: make windows GODOT="$GODOT"
      - name: Clean up
        run: make clean-unzipped GODOT="$GODOT"
      - name: Deploy Linux
        uses: josephbmanley/butler-publish-itchio-action@v1.0.2
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: linux
          ITCH_GAME: ${{ env.PROJECT_NAME }}
          ITCH_USER: blinry
          PACKAGE: build/${{ env.PROJECT_NAME }}-linux.zip
          VERSION: ${{ steps.tag_name.outputs.TAG_NAME }}
      - name: Deploy macOS
        uses: josephbmanley/butler-publish-itchio-action@v1.0.2
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: osx
          ITCH_GAME: ${{ env.PROJECT_NAME }}
          ITCH_USER: blinry
          PACKAGE: build/${{ env.PROJECT_NAME }}-macos.zip
          VERSION: ${{ steps.tag_name.outputs.TAG_NAME }}
      - name: Deploy Windows
        uses: josephbmanley/butler-publish-itchio-action@v1.0.2
        env:
          BUTLER_CREDENTIALS: ${{ secrets.BUTLER_CREDENTIALS }}
          CHANNEL: windows
          ITCH_GAME: ${{ env.PROJECT_NAME }}
          ITCH_USER: blinry
          PACKAGE: build/${{ env.PROJECT_NAME }}-windows.zip
          VERSION: ${{ steps.tag_name.outputs.TAG_NAME }}
